spring.application.name=core

# - Base de datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/byre?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# - JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# - JWT (autenticación)
app.jwt.secret=${JWT_SECRET:change-this-local-jwt-secret-with-at-least-32-characters}
app.jwt.access-token-expiration=1800000
app.jwt.refresh-token-expiration=604800000

# - Servidor
server.port=8080